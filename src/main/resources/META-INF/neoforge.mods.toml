license = "MIT"

modLoader = "javafml"
loaderVersion = "[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "liangforstudy"
description = "Ctrl+drag to copy blocks in creative, then stamp them as blueprints."
logoFile = "assets/creativeblueprint/icon.png"

[[mixins]]
config = "creativeblueprint.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"
